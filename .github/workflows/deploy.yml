name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux Rollup binary
        run: npm install --no-save --package-lock=false @rollup/rollup-linux-x64-gnu@4.63.1

      - name: Build shared package
        run: npm run build --workspace @vendora/shared

      - name: Build storefront
        run: npm run build --workspace @vendora/web

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Deploy storefront to gh-pages
        run: |
          cp -r apps/web/dist/* gh-pages/
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          git diff --cached --quiet || git commit -m "Deploy Vendora storefront ${{ github.sha }}"
          git push origin gh-pages
